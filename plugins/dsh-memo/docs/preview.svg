<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300">
  <!-- Conversation placeholder on the left -->
  <g>
    <rect x="36" y="64" width="270" height="12" rx="6" fill="#8b93a1" fill-opacity=".14"/>
    <rect x="36" y="92" width="210" height="8" rx="4" fill="#8b93a1" fill-opacity=".1"/>
    <rect x="36" y="116" width="252" height="8" rx="4" fill="#8b93a1" fill-opacity=".1"/>
    <rect x="36" y="140" width="180" height="8" rx="4" fill="#8b93a1" fill-opacity=".1"/>
    <rect x="36" y="196" width="300" height="64" rx="14" fill="none" stroke="#8b93a1" stroke-opacity=".3" stroke-width="2"/>
    <path d="M56 228h180" stroke="#8b93a1" stroke-opacity=".18" stroke-width="7" stroke-linecap="round"/>
    <circle cx="310" cy="228" r="13" fill="none" stroke="#8b93a1" stroke-opacity=".3" stroke-width="2"/>
  </g>

  <!-- Collapsed header icon with unread dot -->
  <g>
    <rect x="560" y="18" width="28" height="28" rx="8" fill="none" stroke="#8b93a1" stroke-opacity=".4" stroke-width="1.6"/>
    <path d="M567 26h14M567 32h10" stroke="#8b93a1" stroke-opacity=".7" stroke-width="1.6" stroke-linecap="round"/>
    <circle cx="584" cy="20" r="4" fill="#3aa38a"/>
  </g>

  <!-- Floating memo panel -->
  <g>
    <rect x="352" y="52" width="252" height="220" rx="18" fill="#8b93a1" fill-opacity=".05" stroke="#8b93a1" stroke-opacity=".45" stroke-width="1.6"/>
    <path d="M368 52h220" stroke="#8b93a1" stroke-opacity=".16" stroke-width="2" stroke-linecap="round"/>

    <!-- Panel header -->
    <rect x="370" y="70" width="22" height="22" rx="7" fill="#3aa38a" fill-opacity=".14"/>
    <path d="M375 76h12M375 81h9" stroke="#3aa38a" stroke-width="1.6" stroke-linecap="round"/>
    <rect x="400" y="73" width="96" height="7" rx="3.5" fill="#8b93a1" fill-opacity=".4"/>
    <rect x="400" y="85" width="64" height="5" rx="2.5" fill="#8b93a1" fill-opacity=".2"/>
    <path d="M566 76l6 6-6 6" fill="none" stroke="#8b93a1" stroke-opacity=".4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M548 82v-.1" stroke="#8b93a1" stroke-opacity=".4" stroke-width="6" stroke-linecap="round"/>

    <!-- Hovered row underlay -->
    <rect x="362" y="150" width="232" height="34" rx="10" fill="#3aa38a" fill-opacity=".06"/>
    <rect x="362" y="150" width="2.5" height="34" rx="1.25" fill="#3aa38a" fill-opacity=".5"/>

    <!-- Row 1: open -->
    <circle cx="382" cy="122" r="5" fill="none" stroke="#8b93a1" stroke-opacity=".5" stroke-width="1.6"/>
    <rect x="396" y="117" width="104" height="7" rx="3.5" fill="#8b93a1" fill-opacity=".35"/>
    <rect x="396" y="129" width="146" height="5" rx="2.5" fill="#8b93a1" fill-opacity=".18"/>

    <!-- Row 2: AI-parked -->
    <circle cx="382" cy="167" r="5" fill="none" stroke="#8b93a1" stroke-opacity=".5" stroke-width="1.6"/>
    <rect x="396" y="162" width="120" height="7" rx="3.5" fill="#8b93a1" fill-opacity=".35"/>
    <rect x="524" y="160" width="24" height="12" rx="4" fill="none" stroke="#8b93a1" stroke-opacity=".38" stroke-width="1.2"/>
    <rect x="396" y="174" width="96" height="5" rx="2.5" fill="#8b93a1" fill-opacity=".18"/>

    <!-- Row 3: done -->
    <circle cx="382" cy="212" r="5" fill="#3aa38a"/>
    <path d="M379.4 212l2 2 3.4-3.9" fill="none" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="396" y="207" width="96" height="7" rx="3.5" fill="#8b93a1" fill-opacity=".16"/>
    <path d="M396 210.5h96" stroke="#8b93a1" stroke-opacity=".35" stroke-width="1.2"/>

    <!-- Add requirement button -->
    <rect x="370" y="236" width="216" height="26" rx="8" fill="none" stroke="#3aa38a" stroke-opacity=".45" stroke-width="1.4" stroke-dasharray="5 5"/>
    <path d="M386 249h10M391 244v10" stroke="#3aa38a" stroke-width="1.6" stroke-linecap="round"/>
    <rect x="408" y="246" width="52" height="6" rx="3" fill="#3aa38a" fill-opacity=".35"/>
  </g>
</svg>
